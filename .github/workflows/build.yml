name: Build Portable EXE & Installer

on:
  push:
    branches: [main, 'devin/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build portable EXE
        run: python build.py

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: KrosDownloadManager-portable
          path: dist/KrosDownloadManager.exe
          retention-days: 30

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: KrosDownloadManager-Setup
          path: installer_output/KrosDownloadManager_Setup.exe
          retention-days: 30

      - name: Upload Browser Extension
        uses: actions/upload-artifact@v4
        with:
          name: KrosDownloadManager-Extension
          path: extension/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/KrosDownloadManager.exe
            installer_output/KrosDownloadManager_Setup.exe
          generate_release_notes: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v
