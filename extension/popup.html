<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: #0a0a0a;
      border-bottom: 1px solid #282828;
    }
    .header-icon {
      font-size: 20px;
      margin-right: 10px;
      color: #1db954;
    }
    .header-title {
      font-weight: 700;
      font-size: 14px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #282828;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-dot.connected { background: #1db954; }
    .status-dot.disconnected { background: #e22134; }
    .status-text { color: #b3b3b3; font-size: 12px; }
    .content { padding: 12px 16px; }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #282828;
    }
    .toggle-label { color: #fff; font-size: 13px; }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #404040;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #1db954; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }
    .video-section { padding-top: 10px; }
    .video-title {
      color: #727272;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .video-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: #1a1a1a;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .video-item:hover { background: #282828; }
    .video-item-icon { color: #1db954; margin-right: 8px; font-size: 14px; }
    .video-item-url {
      color: #b3b3b3;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .empty-text {
      color: #727272;
      text-align: center;
      padding: 20px 0;
      font-size: 12px;
    }
    .footer {
      padding: 10px 16px;
      text-align: center;
      color: #727272;
      font-size: 10px;
      border-top: 1px solid #282828;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">&#x2B07;</span>
    <span class="header-title">KrosDownloadManager</span>
  </div>
  <div class="status-bar">
    <span id="statusDot" class="status-dot disconnected"></span>
    <span id="statusText" class="status-text">Verificando conexión...</span>
  </div>
  <div class="content">
    <div class="toggle-row">
      <span class="toggle-label">Capturar descargas</span>
      <label class="toggle">
        <input type="checkbox" id="enableToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="video-section">
      <div class="video-title">Videos detectados</div>
      <div id="videoList">
        <div class="empty-text">Sin videos en esta página</div>
      </div>
    </div>
  </div>
  <div class="footer">v1.0 &middot; Hecho por iSekro</div>
  <script src="popup.js"></script>
</body>
</html>
